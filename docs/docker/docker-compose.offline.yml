# 无外网环境使用：只启动已 load 的镜像，不执行 build / pull
# 用法：
#   docker compose -f docker-compose.offline.yml up -d

name: dataimport

services:
  mysql:
    image: mysql:8.0
    container_name: dataimport-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dataimport}
      MYSQL_USER: ${MYSQL_USER:-dataimport}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ${DATA_ROOT:-/home/mysqldata}/mysql:/var/lib/mysql
      - ../../dataimport.sql:/docker-entrypoint-initdb.d/01-dataimport.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - dataimport-net

  backend:
    image: dataimport-backend:latest
    container_name: dataimport-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-dataimport}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-dataimport}
      DB_CHARSET: utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-3600}
      UPLOAD_FOLDER: uploads
      GUNICORN_BIND: 0.0.0.0:5000
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
    volumes:
      - ${DATA_ROOT:-/home/mysqldata}/uploads:/app/uploads
      - ${DATA_ROOT:-/home/mysqldata}/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dataimport-net
    expose:
      - "5000"

  nginx:
    image: dataimport-nginx:latest
    container_name: dataimport-nginx
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ${DATA_ROOT:-/home/mysqldata}/uploads:/usr/share/nginx/html/uploads:ro
      - ${DATA_ROOT:-/home/mysqldata}/logs/nginx:/var/log/nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - dataimport-net

networks:
  dataimport-net:
    driver: bridge
